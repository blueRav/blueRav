name: Python Portfolio CI
on:
  push:
    paths: ["python/**", "tools/**", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["python/**", "tools/**", ".github/workflows/python-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install website API dependencies when present
        run: |
          if [ -f python/sushi-sei-studio/backend/requirements.txt ]; then
            python -m pip install -r python/sushi-sei-studio/backend/requirements.txt
          fi
      - run: python -m compileall -q python
      - run: python tools/verify_python_suite.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python API dependencies
        run: python -m pip install -r python/sushi-sei-studio/backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: python/sushi-sei-studio/frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend unit tests and production build
        working-directory: python/sushi-sei-studio/frontend
        run: |
          npm test
          npm run build
      - name: Install the test browser
        working-directory: python/sushi-sei-studio/frontend
        run: npx playwright install --with-deps chromium
      - name: Test the complete FastAPI and React flow
        working-directory: python/sushi-sei-studio/frontend
        run: npm run test:ui
      - name: Preserve screenshots, QA report, and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sushi-sei-validation
          path: |
            python/sushi-sei-studio/frontend/artifacts/
            python/sushi-sei-studio/frontend/package-lock.json
